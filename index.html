<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Live Audio Simulator - PoC Test</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: 'Sarabun', system-ui, -apple-system, sans-serif; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      background: #f0f4f9; 
      margin: 0; 
      padding: 16px;
    }
    .card { 
      background: white; 
      padding: 32px 24px; 
      border-radius: 20px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
      width: 100%; 
      max-width: 460px; 
      text-align: center; 
    }
    h2 { color: #1e293b; margin: 0 0 8px 0; font-size: 22px; }
    p { color: #64748b; font-size: 14px; margin: 0 0 20px 0; line-height: 1.5; }
    .status-box { 
      padding: 14px; 
      border-radius: 12px; 
      font-weight: 600; 
      font-size: 15px;
      margin-bottom: 16px; 
      background: #f1f5f9; 
      color: #475569; 
    }
    .status-box.active { background: #dcfce7; color: #15803d; }
    .status-box.error { background: #fee2e2; color: #b91c1c; }
    .btn { 
      background: #2563eb; 
      color: white; 
      border: none; 
      padding: 14px 24px; 
      border-radius: 12px; 
      font-size: 16px; 
      font-weight: 600;
      cursor: pointer; 
      width: 100%; 
    }
    .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    .btn-stop { background: #ef4444; }
    
    .log-box {
      margin-top: 20px;
      padding: 12px;
      background: #0f172a;
      color: #38bdf8;
      font-family: monospace;
      font-size: 12px;
      text-align: left;
      border-radius: 8px;
      max-height: 180px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Gemini Live Audio PoC</h2>
  <p>ระบบทดสอบเสียงโต้ตอบเรียลไทม์ (Debug Mode)</p>
  
  <div id="status" class="status-box">สถานะ: พร้อมเชื่อมต่อ</div>

  <button id="startBtn" class="btn">เริ่มการสนทนา (Start Call)</button>
  <button id="stopBtn" class="btn btn-stop" style="display: none;">จบการสนทนา (End Call)</button>

  <div id="log" class="log-box">-- บันทึกการทำงานระบบ (Debug Log) --</div>
</div>

<script>
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const statusDiv = document.getElementById('status');
  const logDiv = document.getElementById('log');

  let ws = null;
  let audioCtx = null;
  let nextStartTime = 0;

  function log(msg) {
    console.log(msg);
    logDiv.innerText += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
    logDiv.scrollTop = logDiv.scrollHeight;
  }

  function updateStatus(text, type = '') {
    statusDiv.innerText = `สถานะ: ${text}`;
    statusDiv.className = `status-box ${type}`;
  }

  async function playAudioChunk(base64Pcm) {
    if (!audioCtx) return;
    
    if (audioCtx.state === 'suspended') {
      await audioCtx.resume();
    }

    try {
      const binaryString = atob(base64Pcm);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }

      const int16Array = new Int16Array(bytes.buffer, bytes.byteOffset, len / 2);
      const float32Array = new Float32Array(int16Array.length);
      for (let i = 0; i < int16Array.length; i++) {
        float32Array[i] = int16Array[i] / 32768.0;
      }

      const audioBuffer = audioCtx.createBuffer(1, float32Array.length, 24000);
      audioBuffer.getChannelData(0).set(float32Array);

      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(audioCtx.destination);

      const currentTime = audioCtx.currentTime;
      if (nextStartTime < currentTime) nextStartTime = currentTime;

      source.start(nextStartTime);
      nextStartTime += audioBuffer.duration;
    } catch (e) {
      log("Error playing audio chunk: " + e.message);
    }
  }

  async function startSession() {
    log("กำลังเริ่มกระบวนการ...");
    updateStatus("กำลังดึงข้อมูลการเชื่อมต่อ...", "");
    startBtn.disabled = true;

    try {
      const response = await fetch('/api/live');
      const data = await response.json();

      if (!data.key) {
        log("ERROR: ไม่ได้รับ API Key จาก Vercel");
        updateStatus("ไม่พบ GEMINI_API_KEY", "error");
        startBtn.disabled = false;
        return;
      }
      log("ได้รับ API Key เรียบร้อยแล้ว");

      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }
      nextStartTime = audioCtx.currentTime;

      const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${data.key}`;
      log("กำลังเชื่อมต่อ WebSocket ไปยัง Google API (v1alpha)...");
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        log("WebSocket Connected!");
        updateStatus("เชื่อมต่อสำเร็จ! กำลังส่ง Setup...", "active");
        startBtn.style.display = "none";
        stopBtn.style.display = "block";

        const setupMessage = {
          setup: {
            model: "models/gemini-2.5-flash",
            generationConfig: {
              responseModalities: ["AUDIO"],
              speechConfig: {
                voiceConfig: {
                  prebuiltVoiceConfig: { voiceName: "Puck" }
                }
              }
            },
            systemInstruction: {
              parts: [{ 
                text: "คุณคือลูกค้าชื่อ 'น้องฟ้า' ที่กำลังโทรเข้ามาสอบถามประกันภัยรถยนต์ ให้พูดโต้ตอบด้วยน้ำเสียงธรรมชาติมากๆ เหมือนมนุษย์จริง มีจังหวะถอนหายใจ เว้นช่วงคิด พูด 'เอ่อ' หรือ 'อ่า' ได้ตามธรรมชาติ ไม่ต้องพูดจาเป็นทางการเหมือนหุ่นยนต์" 
              }]
            }
          }
        };

        log("ส่ง Setup Message...");
        ws.send(JSON.stringify(setupMessage));
      };

      ws.onmessage = async (event) => {
        try {
          let rawData = event.data;
          if (rawData instanceof Blob) {
            rawData = await rawData.text();
          }
          let resData = JSON.parse(rawData);

          if (resData.setupComplete) {
            log("Setup Complete! พร้อมรับเสียงจาก AI แล้ว");
            updateStatus("พร้อมสนทนา (กำลังฟัง/รอเสียงตอบกลับ)", "active");
            return;
          }

          if (resData.serverContent && resData.serverContent.modelTurn) {
            const parts = resData.serverContent.modelTurn.parts;
            for (const part of parts) {
              if (part.inlineData && part.inlineData.mimeType && part.inlineData.mimeType.startsWith("audio/pcm")) {
                log("กำลังประมวลผลสตรีมเสียง PCM...");
                await playAudioChunk(part.inlineData.data);
              }
            }
          }
        } catch (err) {
          log("Parse Error: " + err.message);
        }
      };

      ws.onerror = (err) => {
        log("WebSocket ERROR Event เกิดขึ้น!");
        updateStatus("เกิดข้อผิดพลาดในการเชื่อมต่อ", "error");
      };

      ws.onclose = (evt) => {
        log(`WebSocket ปิดการเชื่อมต่อ! (Code: ${evt.code}, Reason: "${evt.reason}")`);
        updateStatus("จบการสนทนาเรียบร้อย", "");
        startBtn.style.display = "block";
        startBtn.disabled = false;
        stopBtn.style.display = "none";
      };

    } catch (err) {
      log("Fetch Error: " + err.message);
      updateStatus("ดึง Key ไม่สำเร็จ", "error");
      startBtn.disabled = false;
    }
  }

  function stopSession() {
    log("กดปุ่มจบการสนทนา");
    if (ws) ws.close();
    if (audioCtx) audioCtx.close();
  }

  startBtn.addEventListener('click', startSession);
  stopBtn.addEventListener('click', stopSession);
</script>

</body>
</html>
