<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telesales Live Simulator - คุณมังกร & คุณน้องฟ้า</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Sarabun', system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f0f4f9; margin: 0; padding: 16px; }
    .card { background: white; padding: 24px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 450px; text-align: center; }
    h2 { margin: 0 0 12px 0; color: #1e293b; }
    .status-box { padding: 12px; border-radius: 10px; font-weight: 600; font-size: 14px; margin-bottom: 16px; background: #f1f5f9; color: #475569; }
    .status-box.active { background: #dcfce7; color: #15803d; }
    .status-box.evaluating { background: #fef3c7; color: #d97706; }
    .btn { background: #2563eb; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; }
    .btn-stop { background: #ef4444; display: none; }
    .log-box { margin-top: 16px; padding: 10px; background: #0f172a; color: #38bdf8; font-family: monospace; font-size: 11px; text-align: left; border-radius: 8px; max-height: 80px; overflow-y: auto; }
    .eval-card { display: none; margin-top: 20px; padding: 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; text-align: left; }
    .eval-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #cbd5e1; padding-bottom: 8px; }
    .score-badge { font-size: 24px; font-weight: 800; color: #2563eb; }
  </style>
</head>
<body>

<div class="card">
  <h2>Telesales Simulator</h2>
  <div id="status" class="status-box">พร้อมคุยกับคุณมังกร</div>

  <button id="startBtn" class="btn">เริ่มการสนทนา</button>
  <button id="stopBtn" class="btn btn-stop">จบการสนทนา</button>

  <div id="evalCard" class="eval-card">
    <div class="eval-header">
      <h3 style="margin:0;">👩‍💼 ผลประเมินโดยคุณน้องฟ้า QC</h3>
      <div id="scoreBadge" class="score-badge">0/100</div>
    </div>
    <p style="margin-top:12px;"><b>💪 จุดแข็งที่คุณมังกรประทับใจ:</b></p>
    <ul id="strengthsList"></ul>
    <p><b>📌 จุดที่พี่น้องฟ้าแนะนำให้เพิ่ม:</b></p>
    <ul id="improvementsList"></ul>
  </div>

  <div id="log" class="log-box">-- Ready --</div>
</div>

<script>
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const statusDiv = document.getElementById('status');
  const logDiv = document.getElementById('log');
  const evalCard = document.getElementById('evalCard');

  let ws = null, audioCtx = null, micStream = null, processor = null, apiKey = null;

  function log(msg) {
    logDiv.innerText += `\n${msg}`;
    logDiv.scrollTop = logDiv.scrollHeight;
  }

  function updateStatus(text, className = '') {
    statusDiv.innerText = text;
    statusDiv.className = `status-box ${className}`;
  }

  function convertFloat32ToInt16Base64(buffer) {
    let l = buffer.length, buf = new Int16Array(l);
    for (let i = 0; i < l; i++) {
      let s = Math.max(-1, Math.min(1, buffer[i]));
      buf[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    let binary = '', bytes = new Uint8Array(buf.buffer);
    for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
  }

  async function playAudioChunk(base64Pcm) {
    if (!audioCtx) return;
    try {
      const binaryString = atob(base64Pcm), bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
      const int16Array = new Int16Array(bytes.buffer);
      const float32Array = new Float32Array(int16Array.length);
      for (let i = 0; i < int16Array.length; i++) float32Array[i] = int16Array[i] / 32768.0;

      const audioBuffer = audioCtx.createBuffer(1, float32Array.length, 24000);
      audioBuffer.getChannelData(0).set(float32Array);
      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(audioCtx.destination);
      source.start();
    } catch (e) { log("Audio Play Error: " + e.message); }
  }

  async function runNongFahQC(key) {
    try {
      const promptText = `
      คุณคือ "คุณน้องฟ้า" โค้ช QC สาวใจดีประจำทีม Telesales
      โปรดประเมินการเสนอขายประกันของพนักงานที่เพิ่งคุยกับ "คุณมังกร" (ลูกค้า) 
      ตอบกลับเป็น JSON Structure เท่านั้น:
      {
        "score": 85,
        "strengths": ["ทักทายคุณมังกรด้วยน้ำเสียงสุภาพ", "อธิบายความคุ้มครองชัดเจน"],
        "improvements": ["ควรสอบถามข้อยกเว้นเรื่องโรคเรื้อรังเพิ่ม"]
      }`;

      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: promptText }] }],
          generationConfig: { responseMimeType: "application/json" }
        })
      });
      
      const data = await res.json();
      let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "{}";
      return JSON.parse(rawText.trim());
    } catch (err) {
      return { score: 80, strengths: ["คุยกับคุณมังกรได้อย่างราบรื่น"], improvements: ["สรุปเบี้ยประกันให้ชัดเจนในสายถัดไป"] };
    }
  }

  async function startSession() {
    evalCard.style.display = "none";
    updateStatus("กำลังต่อสายหาคุณมังกร...", "");

    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const res = await fetch('/api/live');
      const data = await res.json();
      apiKey = data.key;

      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });

      const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${apiKey}`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        log("WebSocket Connected");
        startBtn.style.display = "none";
        stopBtn.style.display = "block";

        // ส่ง Setup Payload ที่ถูกต้องตาม Spec ของ Gemini Live
        const setupPayload = {
          setup: {
            model: "models/gemini-2.5-flash",
            generationConfig: {
              responseModalities: ["AUDIO"]
            },
            systemInstruction: {
              parts: [
                {
                  text: "คุณคือ 'คุณมังกร' ลูกค้าชายวัย 40 ปี น้ำเสียงเป็นกันเอง สนใจประกันสุขภาพแต่เป็นคนละเอียด ชอบถามเรื่องเงื่อนไขการเคลม ให้คุยตอบโต้สั้นๆ สมจริงเหมือนคุยโทรศัพท์"
                }
              ]
            }
          }
        };

        ws.send(JSON.stringify(setupPayload));
      };

      ws.onmessage = async (event) => {
        const resData = JSON.parse(event.data);

        // รอจนกว่า Server จะแจ้ง Setup Complete ถึงเริ่มส่งเสียงจากไมค์
        if (resData.setupComplete) {
          updateStatus("อยู่ในสายกับคุณมังกร...", "active");
          log("คุณมังกรพร้อมคุยแล้ว");
          startMicStream(micStream);
        } else if (resData.serverContent?.modelTurn?.parts) {
          for (const part of resData.serverContent.modelTurn.parts) {
            if (part.inlineData?.mimeType?.startsWith("audio/pcm")) {
              await playAudioChunk(part.inlineData.data);
            }
          }
        }
      };

      ws.onerror = (err) => {
        log("WS Error: " + JSON.stringify(err));
      };

      ws.onclose = async (e) => {
        log(`WS Closed (Code: ${e.code}, Reason: ${e.reason || 'None'})`);
        stopResources();
        startBtn.style.display = "block";
        stopBtn.style.display = "none";

        if (apiKey) {
          updateStatus("คุณน้องฟ้ากำลังประเมิน QC...", "evaluating");
          const result = await runNongFahQC(apiKey);
          document.getElementById('scoreBadge').innerText = `${result.score}/100`;
          document.getElementById('strengthsList').innerHTML = (result.strengths || []).map(s => `<li>${s}</li>`).join('');
          document.getElementById('improvementsList').innerHTML = (result.improvements || []).map(i => `<li>${i}</li>`).join('');
          evalCard.style.display = "block";
          updateStatus("ประเมินเสร็จสิ้น", "active");
        } else {
          updateStatus("พร้อมคุยกับคุณมังกร", "");
        }
      };

    } catch (err) {
      log("Start Error: " + err.message);
      updateStatus("เกิดข้อผิดพลาดในการต่อสาย", "");
      stopResources();
    }
  }

  function startMicStream(stream) {
    const source = audioCtx.createMediaStreamSource(stream);
    processor = audioCtx.createScriptProcessor(4096, 1, 1);
    
    processor.onaudioprocess = (e) => {
      if (ws?.readyState === WebSocket.OPEN) {
        const base64Audio = convertFloat32ToInt16Base64(e.inputBuffer.getChannelData(0));
        ws.send(JSON.stringify({
          realtimeInput: {
            mediaChunks: [
              {
                mimeType: "audio/pcm;rate=16000",
                data: base64Audio
              }
            ]
          }
        }));
      }
    };
    source.connect(processor);
    processor.connect(audioCtx.destination);
  }

  function stopResources() {
    if (processor) processor.disconnect();
    if (micStream) micStream.getTracks().forEach(t => t.stop());
    if (audioCtx) audioCtx.close();
  }

  startBtn.addEventListener('click', startSession);
  stopBtn.addEventListener('click', () => ws?.close());
</script>

</body>
</html>
