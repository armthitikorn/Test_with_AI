<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Live Audio Simulator - PoC Test</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: 'Sarabun', system-ui, -apple-system, sans-serif; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      background: #f0f4f9; 
      margin: 0; 
      padding: 16px;
    }
    .card { 
      background: white; 
      padding: 32px 24px; 
      border-radius: 20px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
      width: 100%; 
      max-width: 420px; 
      text-align: center; 
    }
    h2 { color: #1e293b; margin: 0 0 8px 0; font-size: 22px; }
    p { color: #64748b; font-size: 14px; margin: 0 0 20px 0; line-height: 1.5; }
    .status-box { 
      padding: 14px; 
      border-radius: 12px; 
      font-weight: 600; 
      font-size: 15px;
      margin-bottom: 24px; 
      background: #f1f5f9; 
      color: #475569; 
      transition: all 0.3s ease;
    }
    .status-box.active { background: #dcfce7; color: #15803d; }
    .status-box.error { background: #fee2e2; color: #b91c1c; }
    .btn { 
      background: #2563eb; 
      color: white; 
      border: none; 
      padding: 14px 24px; 
      border-radius: 12px; 
      font-size: 16px; 
      font-weight: 600;
      cursor: pointer; 
      transition: background 0.2s; 
      width: 100%; 
    }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
    .btn-stop { background: #ef4444; }
    .btn-stop:hover { background: #dc2626; }
  </style>
</head>
<body>

<div class="card">
  <h2>Gemini Live Audio PoC</h2>
  <p>ระบบทดสอบเสียงโต้ตอบเรียลไทม์<br>(Gemini 2.5 Flash Multimodal Live)</p>
  
  <div id="status" class="status-box">สถานะ: พร้อมเชื่อมต่อ</div>

  <button id="startBtn" class="btn">เริ่มการสนทนา (Start Call)</button>
  <button id="stopBtn" class="btn btn-stop" style="display: none;">จบการสนทนา (End Call)</button>
</div>

<script>
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const statusDiv = document.getElementById('status');

  let ws = null;
  let audioCtx = null;
  let nextStartTime = 0;

  function updateStatus(text, type = '') {
    statusDiv.innerText = `สถานะ: ${text}`;
    statusDiv.className = `status-box ${type}`;
  }

  // แปลง Raw Base64 PCM เป็น AudioBuffer และสั่งเล่นเสียงสตรีมมิ่ง
  async function playAudioChunk(base64Pcm) {
    if (!audioCtx) return;

    const binaryString = atob(base64Pcm);
    const bytes = new Uint8Array(binaryString.length);
    for (let i = 0; i < binaryString.length; i++) {
      bytes[i] = binaryString.charCodeAt(i);
    }

    const int16Array = new Int16Array(bytes.buffer);
    const float32Array = new Float32Array(int16Array.length);
    for (let i = 0; i < int16Array.length; i++) {
      float32Array[i] = int16Array[i] / 32768.0;
    }

    // Gemini Live API ส่งสัญญาณเสียงแบบ PCM 24000Hz Mono
    const audioBuffer = audioCtx.createBuffer(1, float32Array.length, 24000);
    audioBuffer.getChannelData(0).set(float32Array);

    const source = audioCtx.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(audioCtx.destination);

    const currentTime = audioCtx.currentTime;
    if (nextStartTime < currentTime) {
      nextStartTime = currentTime;
    }

    source.start(nextStartTime);
    nextStartTime += audioBuffer.duration;
  }

  function startSession() {
    updateStatus("กำลังเชื่อมต่อ WebSocket Proxy...", "");
    startBtn.disabled = true;

    // สร้าง AudioContext สำหรับเล่นสตรีมเสียง
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
    nextStartTime = audioCtx.currentTime;

    // ชี้การเชื่อมต่อไปยัง WebSocket Proxy บน Vercel (ไม่ต้องแนบ API Key)
    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
const wsUrl = `${wsProtocol}//${window.location.host}/api/live`;
ws = new WebSocket(wsUrl);
    ws.onopen = () => {
      updateStatus("เชื่อมต่อสำเร็จ! สั่งให้ AI พูดทักทาย...", "active");
      startBtn.style.display = "none";
      stopBtn.style.display = "block";

      // 1. ส่ง Setup Configuration กำหนดโมเดล บทบาท และโทนเสียง
      const setupConfig = {
        setup: {
          model: "models/gemini-2.5-flash",
          generationConfig: {
            responseModalities: ["AUDIO"],
            speechConfig: {
              voiceConfig: {
                prebuiltVoiceConfig: {
                  voiceName: "Puck" // โทนเสียงที่เลือกใช้งาน (Puck, Kore, Fenrir, Aoede)
                }
              }
            }
          },
          systemInstruction: {
            parts: [
              { text: "คุณคือลูกค้าที่กำลังโทรเข้ามาสอบถามประกันภัยรถยนต์ ให้พูดทักทายด้วยน้ำเสียงเป็นธรรมชาติ มีเสียงถอนหายใจหรือหัวเราะตามอารมณ์" }
            ]
          }
        }
      };
      ws.send(JSON.stringify(setupConfig));

      // 2. ส่ง Prompt เริ่มต้น
      setTimeout(() => {
        const clientContent = {
          clientContent: {
            turns: [
              {
                role: "user",
                parts: [{ text: "สวัสดีครับ มีอะไรให้ช่วยไหมครับ" }]
              }
            ],
            turnComplete: true
          }
        };
        ws.send(JSON.stringify(clientContent));
      }, 500);
    };

    ws.onmessage = async (event) => {
      try {
        let response = JSON.parse(event.data);
        if (response.serverContent && response.serverContent.modelTurn) {
          const parts = response.serverContent.modelTurn.parts;
          for (const part of parts) {
            if (part.inlineData && part.inlineData.mimeType.startsWith("audio/pcm")) {
              await playAudioChunk(part.inlineData.data);
            }
          }
        }
      } catch (err) {
        console.error("Error parsing WS message:", err);
      }
    };

    ws.onerror = (err) => {
      console.error("WebSocket Error:", err);
      updateStatus("การเชื่อมต่อขัดข้อง (ตรวจสอบ Vercel Env)", "error");
    };

    ws.onclose = () => {
      updateStatus("จบการสนทนาเรียบร้อย", "");
      startBtn.style.display = "block";
      startBtn.disabled = false;
      stopBtn.style.display = "none";
    };
  }

  function stopSession() {
    if (ws) ws.close();
    if (audioCtx) audioCtx.close();
  }

  startBtn.addEventListener('click', startSession);
  stopBtn.addEventListener('click', stopSession);
</script>

</body>
</html>
